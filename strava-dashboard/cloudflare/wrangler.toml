name = "strava-dashboard"
# Live at https://strava-dashboard.adrian-ddf.workers.dev (deployed by Workers Builds from branch ccr-65eb6dcb-8s467i)
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Settings live in the Cloudflare dashboard (Worker → Settings → Variables and Secrets), not in this file:
#   STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET (secret), ACCESS_TEAM_DOMAIN, ACCESS_AUD, ALLOWED_EMAILS.
# keep_vars stops each deploy from wiping them.
keep_vars = true

# The Worker runs first for every request so Cloudflare Access is checked before any file is served.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "STRAVA"
id = "560bd5c5f8e44d3f83d4f4ef0add023f"
