<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Boredom App</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: auto; overflow-y: auto; }

:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #22223b;
  --accent: #7c3aed;
  --accent2: #f59e0b;
  --text: #f1f0ff;
  --muted: #9090b0;
  --radius: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
header {
  text-align: center;
  padding: 2rem 1rem 0;
  background: linear-gradient(135deg, #1a0533 0%, #0f0f1a 100%);
}
header h1 {
  font-size: clamp(1.6rem, 4vw, 2.8rem);
  font-weight: 800;
  background: linear-gradient(90deg, #a78bfa, #f59e0b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -1px;
}
.tagline { color: var(--muted); margin-top: 0.3rem; font-size: 0.95rem; }

/* ── Nav ── */
nav {
  background: linear-gradient(135deg, #1a0533 0%, #0f0f1a 100%);
  padding: 1rem 1rem 0;
  display: flex;
  justify-content: center;
  gap: 0.3rem;
  flex-wrap: wrap;
}
.nav-btn {
  background: none;
  border: none;
  color: var(--muted);
  padding: 0.55rem 1.1rem;
  border-radius: 999px 999px 0 0;
  cursor: pointer;
  font-size: 0.92rem;
  font-weight: 600;
  border-bottom: 3px solid transparent;
  transition: all 0.15s;
}
.nav-btn:hover { color: var(--text); }
.nav-btn.active {
  color: var(--text);
  border-bottom-color: var(--accent);
  background: rgba(124,58,237,0.1);
}

/* ── Pages ── */
.page { display: none; }
.page.active { display: block; }

main {
  flex: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem 1rem;
  width: 100%;
}

/* ── Filters ── */
.filters {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.4rem;
  margin-bottom: 1.5rem;
}
.filter-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 0.45rem;
}
.btn-group { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.filter-btn {
  background: var(--surface2);
  border: 1.5px solid transparent;
  color: var(--text);
  padding: 0.3rem 0.85rem;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.88rem;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--accent); }
.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

/* ── Activity grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: 1rem;
}
.activity-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.3rem;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all 0.18s;
  position: relative;
}
.activity-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow); }
.activity-card .emoji { font-size: 1.9rem; display: block; margin-bottom: 0.45rem; }
.activity-card h3 { font-size: 0.97rem; font-weight: 700; margin-bottom: 0.35rem; }
.activity-card p { font-size: 0.83rem; color: var(--muted); line-height: 1.5; margin-bottom: 0.75rem; }
.activity-card .card-meta { justify-content: flex-start; margin-bottom: 0; }
.activity-card .meta-tag { font-size: 0.72rem; }
.save-btn {
  position: absolute;
  top: 0.85rem; right: 0.85rem;
  background: none; border: none;
  font-size: 1.05rem; cursor: pointer;
  opacity: 0.4; transition: opacity 0.15s; line-height: 1;
}
.save-btn:hover, .save-btn.saved { opacity: 1; }
.save-btn.saved { color: #ef4444; }

/* ── Featured card ── */
.featured-card {
  background: linear-gradient(135deg, #1e0640, #16213e);
  border: 1.5px solid var(--accent);
  border-radius: var(--radius);
  padding: 2rem;
  margin-bottom: 2rem;
  box-shadow: 0 0 40px rgba(124,58,237,0.25);
  animation: pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes pop-in {
  from { transform: scale(0.9); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.card-inner { text-align: center; }
.card-emoji { font-size: 3.5rem; display: block; margin-bottom: 0.5rem; }
.featured-card h2 { font-size: 1.7rem; font-weight: 800; margin-bottom: 0.7rem; }
.featured-card p { color: var(--muted); font-size: 1rem; max-width: 600px; margin: 0 auto 1.1rem; line-height: 1.6; }
.card-meta { display: flex; gap: 0.45rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.1rem; }
.meta-tag { background: var(--surface2); border-radius: 999px; padding: 0.22rem 0.7rem; font-size: 0.8rem; color: var(--muted); }
.card-actions { display: flex; gap: 1rem; justify-content: center; }
.icon-btn {
  background: var(--surface2); border: 1.5px solid transparent;
  color: var(--text); width: 44px; height: 44px; border-radius: 50%;
  font-size: 1.3rem; cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.icon-btn.saved { color: #ef4444; border-color: #ef4444; }

/* ── Misc shared ── */
.hidden { display: none !important; }
.no-results { text-align: center; color: var(--muted); grid-column: 1/-1; padding: 3rem 0; font-size: 1.05rem; }
.section-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.1rem; }
.ghost-btn {
  background: none; border: 1.5px solid var(--surface2); color: var(--muted);
  padding: 0.5rem 1.2rem; border-radius: 999px; cursor: pointer;
  font-size: 0.85rem; margin-top: 1.2rem; transition: all 0.15s;
}
.ghost-btn:hover { border-color: #ef4444; color: #ef4444; }

/* ── Surprise page ── */
.surprise-wrap { max-width: 700px; margin: 0 auto; }
.surprise-quick-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; justify-content: center; }
.spin-btn {
  display: flex; align-items: center; justify-content: center; gap: 0.6rem;
  background: linear-gradient(135deg, var(--accent), #a855f7);
  color: #fff; border: none; padding: 1rem 2.6rem;
  border-radius: 999px; font-size: 1.2rem; font-weight: 700; cursor: pointer;
  box-shadow: 0 0 30px rgba(124,58,237,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  margin: 0 auto 1.5rem; display: block;
}
.spin-btn:hover { transform: scale(1.05); box-shadow: 0 0 44px rgba(124,58,237,0.6); }
.spin-btn:active { transform: scale(0.97); }

/* ── Categories page ── */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
}
.cat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.8rem 1.4rem;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all 0.18s;
  text-align: center;
}
.cat-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow); }
.cat-emoji { font-size: 2.8rem; display: block; margin-bottom: 0.6rem; }
.cat-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.3rem; }
.cat-count { font-size: 0.82rem; color: var(--muted); }

/* ── Favorites page ── */
.empty-state { text-align: center; padding: 4rem 1rem; color: var(--muted); }
.empty-state .big-icon { font-size: 3rem; display: block; margin-bottom: 1rem; }
.empty-state p { font-size: 1rem; line-height: 1.6; }
.empty-link { color: #a78bfa; cursor: pointer; text-decoration: underline; }

footer {
  text-align: center; padding: 1.4rem;
  color: var(--muted); font-size: 0.82rem;
  border-top: 1px solid var(--surface);
}

@media (max-width: 600px) {
  .filters { padding: 1rem; }
  .featured-card { padding: 1.4rem; }
  .featured-card h2 { font-size: 1.35rem; }
  .nav-btn { font-size: 0.8rem; padding: 0.45rem 0.75rem; }
}
  </style>
</head>
<body>

<header>
  <h1>😴 Best Boredom App</h1>
  <p class="tagline">Stop staring at the ceiling. Do something.</p>
</header>

<nav>
  <button class="nav-btn active" data-page="discover">🔍 Discover</button>
  <button class="nav-btn" data-page="surprise">🎲 Surprise Me</button>
  <button class="nav-btn" data-page="favorites">❤️ Favorites</button>
  <button class="nav-btn" data-page="categories">📂 Categories</button>
</nav>

<!-- ══════════════ DISCOVER ══════════════ -->
<div id="page-discover" class="page active">
  <main>
    <section class="filters">
      <div class="filter-group">

          <button class="filter-btn active" data-value="all">All</button>

          <button class="filter-btn" data-value="medium">Medium 🙂</button>
          <button class="filter-btn" data-value="high">High 🔥</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Time Available</label>
        <div class="btn-group" id="time-filter">

          <button class="filter-btn" data-value="30">30 min</button>
          <button class="filter-btn" data-value="60">1 hr+</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Category</label>
        <div class="btn-group" id="category-filter">
          <button class="filter-btn active" data-value="all">All</button>
          <button class="filter-btn" data-value="creative">Creative</button>
          <button class="filter-btn" data-value="active">Active</button>
          <button class="filter-btn" data-value="social">Social</button>
          <button class="filter-btn" data-value="learning">Learning</button>
          <button class="filter-btn" data-value="chill">Chill</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Where</label>
        <div class="btn-group" id="location-filter">

          <button class="filter-btn" data-value="outdoor">Outdoors 🌳</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Who</label>
        <div class="btn-group" id="social-filter">
          <button class="filter-btn active" data-value="all">All</button>
          <button class="filter-btn" data-value="solo">Solo 🙋</button>
          <button class="filter-btn" data-value="group">With others 👥</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Cost</label>
        <div class="btn-group" id="cost-filter">
          <button class="filter-btn active" data-value="all">All</button>
          <button class="filter-btn" data-value="free">Free 🆓</button>
          <button class="filter-btn" data-value="low">Cheap 💸</button>
          <button class="filter-btn" data-value="paid">Costs money 💳</button>
        </div>
      </div>
    </section>

    <section id="featured-card" class="featured-card hidden">
      <div class="card-inner">
        <span class="card-emoji" id="feat-emoji"></span>
        <h2 id="feat-title"></h2>
        <p id="feat-desc"></p>
        <div class="card-meta">
          <span class="meta-tag" id="feat-time"></span>
          <span class="meta-tag" id="feat-energy"></span>
          <span class="meta-tag" id="feat-category"></span>
          <span class="meta-tag" id="feat-location"></span>
          <span class="meta-tag" id="feat-social"></span>
          <span class="meta-tag" id="feat-cost"></span>
        </div>
        <div class="card-actions">
          <button id="feat-save" class="icon-btn" title="Save to favorites">♡</button>
          <button id="feat-next" class="icon-btn" title="Next idea">↻</button>
        </div>
      </div>
    </section>

    <div class="grid" id="activity-grid"></div>
  </main>
</div>

<!-- ══════════════ SURPRISE ME ══════════════ -->
<div id="page-surprise" class="page">
  <main>
    <div class="surprise-wrap">
      <p style="text-align:center;color:var(--muted);margin-bottom:1.2rem;">Filter by energy, then spin for a random pick.</p>
      <div class="surprise-quick-filters">
        <div class="btn-group" id="surprise-energy-filter">
          <button class="filter-btn active" data-value="all">Any energy</button>
          <button class="filter-btn" data-value="low">Low 😪</button>
          <button class="filter-btn" data-value="medium">Medium 🙂</button>
          <button class="filter-btn" data-value="high">High 🔥</button>
        </div>
      </div>
      <button class="spin-btn" id="spin-btn">🎲 Spin!</button>
      <section id="surprise-card" class="featured-card hidden">
        <div class="card-inner">
          <span class="card-emoji" id="sp-emoji"></span>
          <h2 id="sp-title"></h2>
          <p id="sp-desc"></p>
          <div class="card-meta">
            <span class="meta-tag" id="sp-time"></span>
            <span class="meta-tag" id="sp-energy"></span>
            <span class="meta-tag" id="sp-category"></span>
            <span class="meta-tag" id="sp-location"></span>
            <span class="meta-tag" id="sp-social"></span>
            <span class="meta-tag" id="sp-cost"></span>
          </div>
          <div class="card-actions">
            <button id="sp-save" class="icon-btn" title="Save to favorites">♡</button>
            <button id="sp-next" class="icon-btn" title="Spin again">↻</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- ══════════════ FAVORITES ══════════════ -->
<div id="page-favorites" class="page">
  <main>
    <div id="favorites-empty" class="empty-state hidden">
      <span class="big-icon">🤍</span>
      <p>No favourites yet.<br>Go to <span class="empty-link" id="go-discover">Discover</span> or <span class="empty-link" id="go-surprise">Surprise Me</span> and tap ♡ on any activity.</p>
    </div>
    <div id="favorites-content" class="hidden">
      <div class="grid" id="favorites-grid"></div>
      <button id="clear-faves" class="ghost-btn">Clear all favourites</button>
    </div>
  </main>
</div>

<!-- ══════════════ CATEGORIES ══════════════ -->
<div id="page-categories" class="page">
  <main>
    <p style="color:var(--muted);margin-bottom:1.5rem;">Pick a category to browse all activities in it.</p>
    <div class="cat-grid" id="cat-grid"></div>
  </main>
</div>

<footer>
  <p>Made to end your boredom, one idea at a time.</p>
</footer>

var TIME_LABEL     = { 5: "~5 min", 30: "~30 min", 60: "1 hr+" };
var ENERGY_LABEL   = { low: "Low energy 😪", medium: "Medium 🙂", high: "High energy 🔥" };
var LOCATION_LABEL = { indoor: "Indoors 🏠", outdoor: "Outdoors 🌳", either: "Anywhere" };
var SOCIAL_LABEL   = { solo: "Solo 🙋", group: "With others 👥", either: "Either" };
var COST_LABEL     = { free: "Free 🆓", low: "Cheap 💸", paid: "Costs money 💳" };

var CATEGORIES = [
  { id: "creative", emoji: "🎨", name: "Creative" },
  { id: "active",   emoji: "💪", name: "Active"   },
  { id: "social",   emoji: "👥", name: "Social"   },
  { id: "learning", emoji: "📚", name: "Learning" },
  { id: "chill",    emoji: "😌", name: "Chill"    },
];

/* ── State ── */
var favorites = [];
try { favorites = JSON.parse(localStorage.getItem("boredom-faves") || "[]"); } catch(e) {}
var currentSurpriseActivity = null;

function saveFavorites() { try { localStorage.setItem("boredom-faves", JSON.stringify(favorites)); } catch(e) {} }
function isSaved(id) { return favorites.indexOf(id) !== -1; }
function toggleFave(id) {
  favorites = isSaved(id) ? favorites.filter(function(f) { return f !== id; }) : favorites.concat([id]);
  saveFavorites();
}

/* ── Navigation ── */
function showPage(name) {
  var pages = document.querySelectorAll(".page");
  for (var i = 0; i < pages.length; i++) pages[i].classList.remove("active");
  var navBtns = document.querySelectorAll(".nav-btn");
  for (var i = 0; i < navBtns.length; i++) navBtns[i].classList.remove("active");

  document.getElementById("page-" + name).classList.add("active");
  var btn = document.querySelector(".nav-btn[data-page='" + name + "']");
  if (btn) btn.classList.add("active");

  if (name === "discover")    renderGrid();
  if (name === "surprise")    spinSurprise();
  if (name === "favorites")   renderFavoritesPage();
  if (name === "categories")  renderCategories();

  try { location.hash = name; } catch(e) {}
}

var navBtns = document.querySelectorAll(".nav-btn");
for (var i = 0; i < navBtns.length; i++) {
  (function(btn) {
    btn.addEventListener("click", function() { showPage(btn.getAttribute("data-page")); });
  })(navBtns[i]);
}

/* ── Filter helpers (Discover) ── */
function getActiveFilter(groupId) {
  var active = document.getElementById(groupId).querySelector(".filter-btn.active");
  return active ? active.getAttribute("data-value") : "all";
}

function getFiltered() {
  var energy   = getActiveFilter("energy-filter");
  var time     = getActiveFilter("time-filter");
  var category = getActiveFilter("category-filter");
  var location = getActiveFilter("location-filter");
  var social   = getActiveFilter("social-filter");
  var cost     = getActiveFilter("cost-filter");
  return ACTIVITIES.filter(function(a) {
    if (energy   !== "all" && a.energy   !== energy)                               return false;
    if (time     !== "all" && a.time     !== Number(time))                         return false;
    if (category !== "all" && a.category !== category)                             return false;
    if (location !== "all" && a.location !== location && a.location !== "either")  return false;
    if (social   !== "all" && a.social   !== social   && a.social   !== "either")  return false;
    if (cost     !== "all" && a.cost     !== cost)                                 return false;
    return true;
  });
}

/* ── Shared card builder ── */
function makeActivityCard(activity, onSaveToggle) {
  var card = document.createElement("div");
  card.className = "activity-card";
  var saved = isSaved(activity.id);
  card.innerHTML =
    '<span class="emoji">' + activity.emoji + '</span>' +
    '<h3>' + activity.title + '</h3>' +
    '<p>' + activity.desc + '</p>' +
    '<div class="card-meta">' +
      '<span class="meta-tag">' + TIME_LABEL[activity.time] + '</span>' +
      '<span class="meta-tag">' + activity.category + '</span>' +
      '<span class="meta-tag">' + COST_LABEL[activity.cost] + '</span>' +
    '</div>' +
    '<button class="save-btn' + (saved ? ' saved' : '') + '" title="Save">' + (saved ? '❤️' : '🤍') + '</button>';
  card.querySelector(".save-btn").addEventListener("click", function(e) {
    e.stopPropagation();
    toggleFave(activity.id);
    if (onSaveToggle) onSaveToggle();
  });
  return card;
}

/* ── Shared featured card renderer ── */
function renderFeaturedCard(ids, activity) {
  document.getElementById(ids.emoji).textContent    = activity.emoji;
  document.getElementById(ids.title).textContent    = activity.title;
  document.getElementById(ids.desc).textContent     = activity.desc;
  document.getElementById(ids.time).textContent     = TIME_LABEL[activity.time];
  document.getElementById(ids.energy).textContent   = ENERGY_LABEL[activity.energy];
  document.getElementById(ids.category).textContent = activity.category.charAt(0).toUpperCase() + activity.category.slice(1);
  document.getElementById(ids.location).textContent = LOCATION_LABEL[activity.location];
  document.getElementById(ids.social).textContent   = SOCIAL_LABEL[activity.social];
  document.getElementById(ids.cost).textContent     = COST_LABEL[activity.cost];
  var saveEl = document.getElementById(ids.save);
  saveEl.textContent  = isSaved(activity.id) ? "❤️" : "♡";
  saveEl.className    = "icon-btn" + (isSaved(activity.id) ? " saved" : "");
  var cardEl = document.getElementById(ids.card);
  cardEl.classList.remove("hidden");
  cardEl.style.animation = "none";
  void cardEl.offsetHeight;
  cardEl.style.animation = "";
}

/* ═══════════ DISCOVER PAGE ═══════════ */
var discoverCurrent = null;

function renderGrid() {
  var grid = document.getElementById("activity-grid");
  grid.innerHTML = "";
  var items = getFiltered();
  if (!items.length) {
    var msg = document.createElement("p");
    msg.className = "no-results";
    msg.textContent = "No activities match your filters. Try broadening them!";
    grid.appendChild(msg);
    document.getElementById("featured-card").classList.add("hidden");
    return;
  }
  for (var i = 0; i < items.length; i++) {
    (function(act) {
      var card = makeActivityCard(act, function() { renderGrid(); });
      card.addEventListener("click", function() {
        discoverCurrent = act;
        renderFeaturedCard({
          card: "featured-card", emoji: "feat-emoji", title: "feat-title",
          desc: "feat-desc", time: "feat-time", energy: "feat-energy",
          category: "feat-category", location: "feat-location",
          social: "feat-social", cost: "feat-cost", save: "feat-save"
        }, act);
      });
      grid.appendChild(card);
    })(items[i]);
  }
}

document.getElementById("feat-save").addEventListener("click", function() {
  if (!discoverCurrent) return;
  toggleFave(discoverCurrent.id);
  renderFeaturedCard({
    card: "featured-card", emoji: "feat-emoji", title: "feat-title",
    desc: "feat-desc", time: "feat-time", energy: "feat-energy",
    category: "feat-category", location: "feat-location",
    social: "feat-social", cost: "feat-cost", save: "feat-save"
  }, discoverCurrent);
  renderGrid();
});

function showDiscoverSuggestion() {
  var pool = getFiltered();
  if (!pool.length) return;
  discoverCurrent = pool[Math.floor(Math.random() * pool.length)];
  renderFeaturedCard({
    card: "featured-card", emoji: "feat-emoji", title: "feat-title",
    desc: "feat-desc", time: "feat-time", energy: "feat-energy",
    category: "feat-category", location: "feat-location",
    social: "feat-social", cost: "feat-cost", save: "feat-save"
  }, discoverCurrent);
}

document.getElementById("feat-next").addEventListener("click", showDiscoverSuggestion);

/* Filter buttons for Discover — auto-suggest on selection */
var allFilterBtns = document.querySelectorAll("#page-discover .filter-btn");
for (var i = 0; i < allFilterBtns.length; i++) {
  (function(btn) {
    btn.addEventListener("click", function() {
      var group = btn.parentElement;
      var siblings = group.querySelectorAll(".filter-btn");
      for (var j = 0; j < siblings.length; j++) siblings[j].classList.remove("active");
      btn.classList.add("active");
      renderGrid();
      showDiscoverSuggestion();
    });
  })(allFilterBtns[i]);
}

/* ═══════════ SURPRISE ME PAGE ═══════════ */
function spinSurprise() {
  var energyFilter = getActiveFilter("surprise-energy-filter");
  var pool = ACTIVITIES.filter(function(a) {
    return energyFilter === "all" || a.energy === energyFilter;
  });
  if (!pool.length) return;
  var act = pool[Math.floor(Math.random() * pool.length)];
  currentSurpriseActivity = act;
  renderFeaturedCard({
    card: "surprise-card", emoji: "sp-emoji", title: "sp-title",
    desc: "sp-desc", time: "sp-time", energy: "sp-energy",
    category: "sp-category", location: "sp-location",
    social: "sp-social", cost: "sp-cost", save: "sp-save"
  }, act);
}

document.getElementById("spin-btn").addEventListener("click", spinSurprise);

document.getElementById("sp-next").addEventListener("click", spinSurprise);

document.getElementById("sp-save").addEventListener("click", function() {
  if (!currentSurpriseActivity) return;
  toggleFave(currentSurpriseActivity.id);
  renderFeaturedCard({
    card: "surprise-card", emoji: "sp-emoji", title: "sp-title",
    desc: "sp-desc", time: "sp-time", energy: "sp-energy",
    category: "sp-category", location: "sp-location",
    social: "sp-social", cost: "sp-cost", save: "sp-save"
  }, currentSurpriseActivity);
});

var surpriseFilterBtns = document.querySelectorAll("#surprise-energy-filter .filter-btn");
for (var i = 0; i < surpriseFilterBtns.length; i++) {
  (function(btn) {
    btn.addEventListener("click", function() {
      var siblings = document.querySelectorAll("#surprise-energy-filter .filter-btn");
      for (var j = 0; j < siblings.length; j++) siblings[j].classList.remove("active");
      btn.classList.add("active");
      spinSurprise();
    });
  })(surpriseFilterBtns[i]);
}

/* ═══════════ FAVORITES PAGE ═══════════ */
function renderFavoritesPage() {
  var empty   = document.getElementById("favorites-empty");
  var content = document.getElementById("favorites-content");
  var grid    = document.getElementById("favorites-grid");
  grid.innerHTML = "";

  if (!favorites.length) {
    empty.classList.remove("hidden");
    content.classList.add("hidden");
    return;
  }
  empty.classList.add("hidden");
  content.classList.remove("hidden");

  for (var i = 0; i < ACTIVITIES.length; i++) {
    if (isSaved(ACTIVITIES[i].id)) {
      (function(act) {
        var card = makeActivityCard(act, function() { renderFavoritesPage(); });
        grid.appendChild(card);
      })(ACTIVITIES[i]);
    }
  }
}

document.getElementById("clear-faves").addEventListener("click", function() {
  favorites = []; saveFavorites(); renderFavoritesPage();
});
document.getElementById("go-discover").addEventListener("click", function() { showPage("discover"); });
document.getElementById("go-surprise").addEventListener("click", function() { showPage("surprise"); });

/* ═══════════ CATEGORIES PAGE ═══════════ */
function renderCategories() {
  var grid = document.getElementById("cat-grid");
  grid.innerHTML = "";
  for (var i = 0; i < CATEGORIES.length; i++) {
    (function(cat) {
      var count = ACTIVITIES.filter(function(a) { return a.category === cat.id; }).length;
      var card = document.createElement("div");
      card.className = "cat-card";
      card.innerHTML =
        '<span class="cat-emoji">' + cat.emoji + '</span>' +
        '<div class="cat-name">' + cat.name + '</div>' +
        '<div class="cat-count">' + count + ' activities</div>';
      card.addEventListener("click", function() {
        showPage("discover");
        /* Set the category filter to this category */
        var catBtns = document.querySelectorAll("#category-filter .filter-btn");
        for (var j = 0; j < catBtns.length; j++) {
          catBtns[j].classList.remove("active");
          if (catBtns[j].getAttribute("data-value") === cat.id) catBtns[j].classList.add("active");
        }
        renderGrid();
      });
      grid.appendChild(card);
    })(CATEGORIES[i]);
  }
}

/* ── Boot ── */
renderGrid();
renderCategories();
</script>
</body>
</html>
