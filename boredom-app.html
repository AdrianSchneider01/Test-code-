<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Boredom App</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #22223b;
  --accent: #7c3aed;
  --accent2: #f59e0b;
  --accent3: #10b981;
  --text: #f1f0ff;
  --muted: #9090b0;
  --radius: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  padding: 3rem 1rem 1.5rem;
  background: linear-gradient(135deg, #1a0533 0%, #0f0f1a 100%);
}

header h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 800;
  background: linear-gradient(90deg, #a78bfa, #f59e0b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -1px;
}

.tagline {
  color: var(--muted);
  margin-top: 0.5rem;
  font-size: 1.1rem;
}

main {
  flex: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem 1rem;
  width: 100%;
}

.filters {
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.filter-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 0.5rem;
}

.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.filter-btn {
  background: var(--surface2);
  border: 1.5px solid transparent;
  color: var(--text);
  padding: 0.35rem 0.9rem;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.18s;
}

.filter-btn:hover { border-color: var(--accent); }

.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

.cta-row {
  display: flex;
  justify-content: center;
  margin-bottom: 2rem;
}

.surprise-btn {
  background: linear-gradient(135deg, var(--accent), #a855f7);
  color: #fff;
  border: none;
  padding: 0.9rem 2.4rem;
  border-radius: 999px;
  font-size: 1.25rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  box-shadow: 0 0 30px rgba(124,58,237,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
}

.surprise-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 44px rgba(124,58,237,0.6);
}

.surprise-btn:active { transform: scale(0.98); }

.btn-icon { font-size: 1.4rem; }

.featured-card {
  background: linear-gradient(135deg, #1e0640, #16213e);
  border: 1.5px solid var(--accent);
  border-radius: var(--radius);
  padding: 2rem;
  margin-bottom: 2.5rem;
  box-shadow: 0 0 40px rgba(124,58,237,0.25);
  animation: pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes pop-in {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.hidden { display: none !important; }

.card-inner { text-align: center; }

.card-emoji { font-size: 3.5rem; display: block; margin-bottom: 0.5rem; }

.featured-card h2 {
  font-size: 1.8rem;
  font-weight: 800;
  margin-bottom: 0.75rem;
}

.featured-card p {
  color: var(--muted);
  font-size: 1.05rem;
  max-width: 600px;
  margin: 0 auto 1.2rem;
  line-height: 1.6;
}

.card-meta {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 1.2rem;
}

.meta-tag {
  background: var(--surface2);
  border-radius: 999px;
  padding: 0.25rem 0.75rem;
  font-size: 0.82rem;
  color: var(--muted);
}

.card-actions {
  display: flex;
  gap: 1rem;
  justify-content: center;
}

.icon-btn {
  background: var(--surface2);
  border: 1.5px solid transparent;
  color: var(--text);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 1.3rem;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.icon-btn.saved { color: #ef4444; border-color: #ef4444; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.1rem;
}

.activity-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.4rem;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all 0.18s;
  position: relative;
}

.activity-card:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}

.activity-card .emoji { font-size: 2rem; display: block; margin-bottom: 0.5rem; }

.activity-card h3 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 0.4rem;
}

.activity-card p {
  font-size: 0.85rem;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 0.8rem;
}

.activity-card .card-meta { justify-content: flex-start; margin-bottom: 0; }
.activity-card .meta-tag { font-size: 0.75rem; }

.save-btn {
  position: absolute;
  top: 0.9rem;
  right: 0.9rem;
  background: none;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  opacity: 0.4;
  transition: opacity 0.15s;
  line-height: 1;
}

.save-btn:hover, .save-btn.saved { opacity: 1; }
.save-btn.saved { color: #ef4444; }

.no-results {
  text-align: center;
  color: var(--muted);
  grid-column: 1 / -1;
  padding: 3rem 0;
  font-size: 1.1rem;
}

.favorites-section {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--surface2);
}

.favorites-section h2 {
  font-size: 1.4rem;
  margin-bottom: 1.2rem;
}

.ghost-btn {
  background: none;
  border: 1.5px solid var(--surface2);
  color: var(--muted);
  padding: 0.5rem 1.2rem;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.85rem;
  margin-top: 1.2rem;
  transition: all 0.15s;
}

.ghost-btn:hover { border-color: #ef4444; color: #ef4444; }

footer {
  text-align: center;
  padding: 1.5rem;
  color: var(--muted);
  font-size: 0.85rem;
  border-top: 1px solid var(--surface);
}

@media (max-width: 600px) {
  .filters { padding: 1rem; }
  .featured-card { padding: 1.4rem; }
  .featured-card h2 { font-size: 1.4rem; }
}
  </style>
</head>
<body>
  <header>
    <h1>😴 Best Boredom App</h1>
    <p class="tagline">Stop staring at the ceiling. Do something.</p>
  </header>

  <main>
    <section class="filters">
      <div class="filter-group">
        <label>Energy Level</label>
        <div class="btn-group" id="energy-filter">
          <button class="filter-btn active" data-value="all">All</button>
          <button class="filter-btn" data-value="low">Low 😪</button>
          <button class="filter-btn" data-value="medium">Medium 🙂</button>
          <button class="filter-btn" data-value="high">High 🔥</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Time Available</label>
        <div class="btn-group" id="time-filter">
          <button class="filter-btn active" data-value="all">All</button>
          <button class="filter-btn" data-value="5">5 min</button>
          <button class="filter-btn" data-value="30">30 min</button>
          <button class="filter-btn" data-value="60">1 hr+</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Category</label>
        <div class="btn-group" id="category-filter">
          <button class="filter-btn active" data-value="all">All</button>
          <button class="filter-btn" data-value="creative">Creative</button>
          <button class="filter-btn" data-value="active">Active</button>
          <button class="filter-btn" data-value="social">Social</button>
          <button class="filter-btn" data-value="learning">Learning</button>
          <button class="filter-btn" data-value="chill">Chill</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Where</label>
        <div class="btn-group" id="location-filter">
          <button class="filter-btn active" data-value="all">All</button>
          <button class="filter-btn" data-value="indoor">Indoors 🏠</button>
          <button class="filter-btn" data-value="outdoor">Outdoors 🌳</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Who</label>
        <div class="btn-group" id="social-filter">
          <button class="filter-btn active" data-value="all">All</button>
          <button class="filter-btn" data-value="solo">Solo 🙋</button>
          <button class="filter-btn" data-value="group">With others 👥</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Cost</label>
        <div class="btn-group" id="cost-filter">
          <button class="filter-btn active" data-value="all">All</button>
          <button class="filter-btn" data-value="free">Free 🆓</button>
          <button class="filter-btn" data-value="low">Cheap 💸</button>
          <button class="filter-btn" data-value="paid">Costs money 💳</button>
        </div>
      </div>
    </section>

    <div class="cta-row">
      <button id="surprise-btn" class="surprise-btn">
        <span class="btn-icon">🎲</span> Surprise Me!
      </button>
    </div>

    <section id="featured-card" class="featured-card hidden">
      <div class="card-inner">
        <span class="card-emoji" id="feat-emoji"></span>
        <h2 id="feat-title"></h2>
        <p id="feat-desc"></p>
        <div class="card-meta">
          <span class="meta-tag" id="feat-time"></span>
          <span class="meta-tag" id="feat-energy"></span>
          <span class="meta-tag" id="feat-category"></span>
          <span class="meta-tag" id="feat-location"></span>
          <span class="meta-tag" id="feat-social"></span>
          <span class="meta-tag" id="feat-cost"></span>
        </div>
        <div class="card-actions">
          <button id="feat-save" class="icon-btn" title="Save to favorites">♡</button>
          <button id="feat-next" class="icon-btn" title="Next idea">↻</button>
        </div>
      </div>
    </section>

    <section class="grid" id="activity-grid"></section>

    <section class="favorites-section hidden" id="favorites-section">
      <h2>Your Favorites ❤️</h2>
      <div class="grid" id="favorites-grid"></div>
      <button id="clear-faves" class="ghost-btn">Clear all favorites</button>
    </section>
  </main>

  <footer>
    <p>Made to end your boredom, one idea at a time.</p>
  </footer>

  <script>
var ACTIVITIES = [
  // Creative
  { id: 1,  emoji: "🎨", title: "Doodle something random",           desc: "Open a blank page and draw whatever comes to mind. No rules, no judgment — just let your hand move.",                                     category: "creative", energy: "low",    time: 5,  location: "indoor",  social: "solo",  cost: "free" },
  { id: 2,  emoji: "✍️", title: "Write a 6-word story",              desc: "Challenge yourself to tell a complete story in exactly six words. Hemingway supposedly invented this.",                                     category: "creative", energy: "low",    time: 5,  location: "indoor",  social: "solo",  cost: "free" },
  { id: 3,  emoji: "📸", title: "Take interesting photos",           desc: "Walk around your space and find 10 interesting shots. Look for light, texture, or odd angles.",                                           category: "creative", energy: "medium", time: 30, location: "either",  social: "solo",  cost: "free" },

  { id: 7,  emoji: "🖼️", title: "Rearrange your space",              desc: "Move furniture around, swap out decor, or just tidy and redecorate a single shelf.",                                                     category: "creative", energy: "high",   time: 60, location: "indoor",  social: "solo",  cost: "free" },
  { id: 8,  emoji: "🎨", title: "Try painting by numbers",           desc: "Grab a kit from a shop or print a template online. Meditative, satisfying, and you end up with actual art.",                             category: "creative", energy: "low",    time: 60, location: "indoor",  social: "solo",  cost: "low"  },
  { id: 9,  emoji: "🗂️", title: "Redesign your phone home screen",   desc: "Pick a new wallpaper, reorganise apps into folders, change your icon pack. Make it feel new again.",                                     category: "creative", energy: "low",    time: 30, location: "indoor",  social: "solo",  cost: "free" },

  // Active
  { id: 11, emoji: "🕺", title: "Have a solo dance party",           desc: "Pick three of your favourite songs and dance like nobody's watching. Because nobody is.",                                                 category: "active",   energy: "high",   time: 5,  location: "indoor",  social: "solo",  cost: "free" },
  { id: 12, emoji: "🧘", title: "Do a 10-min yoga flow",             desc: "Search 'beginner yoga 10 minutes' and follow along. Your back will thank you.",                                                          category: "active",   energy: "low",    time: 5,  location: "indoor",  social: "solo",  cost: "free" },
  { id: 13, emoji: "🚶", title: "Take a walk with no destination",   desc: "Go outside and turn wherever feels right. No maps, no podcasts — just observe the world.",                                               category: "active",   energy: "medium", time: 30, location: "outdoor", social: "solo",  cost: "free" },
  { id: 14, emoji: "💪", title: "7-minute workout",                  desc: "The classic scientific 7-minute circuit: jumping jacks, wall sit, push-ups, crunches — full body, no gear.",                             category: "active",   energy: "high",   time: 5,  location: "indoor",  social: "solo",  cost: "free" },
  { id: 15, emoji: "🤸", title: "Try 10 new stretches",              desc: "Look up stretches you've never tried before. Focus on the spots that feel tight.",                                                       category: "active",   energy: "low",    time: 30, location: "indoor",  social: "solo",  cost: "free" },
  { id: 16, emoji: "🏃", title: "Run to one landmark and back",      desc: "Pick something visible from your place — a park, a sign, a corner — and sprint there and back.",                                        category: "active",   energy: "high",   time: 30, location: "outdoor", social: "solo",  cost: "free" },
  { id: 17, emoji: "🚴", title: "Go for a bike ride",                desc: "No destination needed. Just ride for 30 minutes and see where you end up. Good for the body and the brain.",                            category: "active",   energy: "medium", time: 60, location: "outdoor", social: "solo",  cost: "free" },
  { id: 18, emoji: "🏊", title: "Go for a swim",                     desc: "Find a local pool or open water spot. Even 20 lengths is enough to completely reset your headspace.",                                    category: "active",   energy: "high",   time: 60, location: "outdoor", social: "solo",  cost: "low"  },
  { id: 19, emoji: "🤹", title: "Learn to juggle",                   desc: "Start with two balls, then three. There are solid tutorials on YouTube. It takes a week to get decent — start today.",                  category: "active",   energy: "medium", time: 30, location: "indoor",  social: "solo",  cost: "free" },

  { id: 38, emoji: "🛁", title: "Take a long bath or shower",        desc: "Light a candle, put on music, and stay in way longer than necessary. You deserve it.",                                                   category: "chill",    energy: "low",    time: 30, location: "indoor",  social: "solo",  cost: "free" },

  { id: 40, emoji: "🌿", title: "Sit outside and do nothing",        desc: "Find a spot outside and sit for 10 minutes without your phone. Just look at stuff. It's surprisingly good.",                            category: "chill",    energy: "low",    time: 5,  location: "outdoor", social: "solo",  cost: "free" },

var TIME_LABEL = { 5: "~5 min", 30: "~30 min", 60: "1 hr+" };
var ENERGY_LABEL = { low: "Low energy 😪", medium: "Medium energy 🙂", high: "High energy 🔥" };
var LOCATION_LABEL = { indoor: "Indoors 🏠", outdoor: "Outdoors 🌳", either: "Anywhere" };
var SOCIAL_LABEL = { solo: "Solo 🙋", group: "With others 👥", either: "Either" };
var COST_LABEL = { free: "Free 🆓", low: "Cheap 💸", paid: "Costs money 💳" };

var favorites = [];
try { favorites = JSON.parse(localStorage.getItem("boredom-faves") || "[]"); } catch(e) {}
var currentFeatured = null;

function saveFavorites() { try { localStorage.setItem("boredom-faves", JSON.stringify(favorites)); } catch(e) {} }
function isSaved(id) { return favorites.indexOf(id) !== -1; }
function toggleFave(id) {
  favorites = isSaved(id) ? favorites.filter(function(f) { return f !== id; }) : favorites.concat([id]);
  saveFavorites();
}

function getActiveFilter(groupId) {
  var active = document.getElementById(groupId).querySelector(".filter-btn.active");
  return active ? active.getAttribute("data-value") : "all";
}

function getFiltered() {
  var energy   = getActiveFilter("energy-filter");
  var time     = getActiveFilter("time-filter");
  var category = getActiveFilter("category-filter");
  var location = getActiveFilter("location-filter");
  var social   = getActiveFilter("social-filter");
  var cost     = getActiveFilter("cost-filter");
  return ACTIVITIES.filter(function(a) {
    if (energy   !== "all" && a.energy   !== energy)         return false;
    if (time     !== "all" && a.time     !== Number(time))   return false;
    if (category !== "all" && a.category !== category)       return false;
    if (location !== "all" && a.location !== location && a.location !== "either") return false;
    if (social   !== "all" && a.social   !== social   && a.social   !== "either") return false;
    if (cost     !== "all" && a.cost     !== cost)           return false;
    return true;
  });
}

function renderFeatured(activity) {
  var card = document.getElementById("featured-card");
  document.getElementById("feat-emoji").textContent = activity.emoji;
  document.getElementById("feat-title").textContent = activity.title;
  document.getElementById("feat-desc").textContent = activity.desc;
  document.getElementById("feat-time").textContent = TIME_LABEL[activity.time];
  document.getElementById("feat-energy").textContent = ENERGY_LABEL[activity.energy];
  document.getElementById("feat-category").textContent = activity.category.charAt(0).toUpperCase() + activity.category.slice(1);
  document.getElementById("feat-location").textContent = LOCATION_LABEL[activity.location];
  document.getElementById("feat-social").textContent = SOCIAL_LABEL[activity.social];
  document.getElementById("feat-cost").textContent = COST_LABEL[activity.cost];
  var saveBtn = document.getElementById("feat-save");
  saveBtn.textContent = isSaved(activity.id) ? "❤️" : "♡";
  saveBtn.className = "icon-btn" + (isSaved(activity.id) ? " saved" : "");
  saveBtn.onclick = function() { toggleFave(activity.id); renderFeatured(activity); renderGrid(); renderFavorites(); };
  card.classList.remove("hidden");
  card.style.animation = "none";
  void card.offsetHeight;
  card.style.animation = "";
  currentFeatured = activity;
}

function surpriseMe() {
  var pool = getFiltered();
  if (!pool.length) return;
  renderFeatured(pool[Math.floor(Math.random() * pool.length)]);
}

function makeActivityCard(activity) {
  var card = document.createElement("div");
  card.className = "activity-card";
  var saved = isSaved(activity.id);
  card.innerHTML =
    '<span class="emoji">' + activity.emoji + '</span>' +
    '<h3>' + activity.title + '</h3>' +
    '<p>' + activity.desc + '</p>' +
    '<div class="card-meta">' +
      '<span class="meta-tag">' + TIME_LABEL[activity.time] + '</span>' +
      '<span class="meta-tag">' + activity.category + '</span>' +
    '</div>' +
    '<button class="save-btn' + (saved ? ' saved' : '') + '" title="Save to favorites">' + (saved ? '❤️' : '🤍') + '</button>';
  card.querySelector(".save-btn").addEventListener("click", function(e) {
    e.stopPropagation();
    toggleFave(activity.id);
    renderGrid(); renderFavorites();
    if (currentFeatured && currentFeatured.id === activity.id) renderFeatured(activity);
  });
  card.addEventListener("click", function() { renderFeatured(activity); });
  return card;
}

function renderGrid() {
  var grid = document.getElementById("activity-grid");
  grid.innerHTML = "";
  var items = getFiltered();
  if (!items.length) {
    var msg = document.createElement("p");
    msg.className = "no-results";
    msg.textContent = "No activities match your filters. Try broadening them!";
    grid.appendChild(msg);
    return;
  }
  for (var i = 0; i < items.length; i++) { grid.appendChild(makeActivityCard(items[i])); }
}

function renderFavorites() {
  var section = document.getElementById("favorites-section");
  var grid = document.getElementById("favorites-grid");
  grid.innerHTML = "";
  if (!favorites.length) { section.classList.add("hidden"); return; }
  section.classList.remove("hidden");
  for (var i = 0; i < ACTIVITIES.length; i++) {
    if (isSaved(ACTIVITIES[i].id)) grid.appendChild(makeActivityCard(ACTIVITIES[i]));
  }
}

function setupFilters() {
  var allBtns = document.querySelectorAll(".filter-btn");
  for (var i = 0; i < allBtns.length; i++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        var group = btn.parentElement;
        var siblings = group.querySelectorAll(".filter-btn");
        for (var j = 0; j < siblings.length; j++) {
          siblings[j].classList.remove("active");
        }
        btn.classList.add("active");
        renderGrid();
      });
    })(allBtns[i]);
  }
}

document.getElementById("surprise-btn").addEventListener("click", surpriseMe);
document.getElementById("feat-next").addEventListener("click", surpriseMe);
document.getElementById("clear-faves").addEventListener("click", function() {
  favorites = []; saveFavorites(); renderGrid(); renderFavorites();
  if (currentFeatured) renderFeatured(currentFeatured);
});

setupFilters();
renderGrid();
renderFavorites();
  </script>
</body>
</html>
